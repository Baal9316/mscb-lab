<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 920" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <linearGradient id="boxg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>
  <style>
    .box { fill: url(#boxg); stroke: #94a3b8; stroke-width: 1.5; rx: 8; }
    .box-svc { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; rx: 6; }
    .svc { font-size: 11px; fill: #64748b; }
    .title { font-size: 13px; font-weight: 600; fill: #0f172a; }
    .sub { font-size: 10.5px; fill: #334155; }
    .tag { font-size: 10px; fill: #475569; }
    .arrow { stroke: #64748b; stroke-width: 1.8; fill: none; marker-end: url(#arr); }
    .head { font-size: 16px; font-weight: 700; fill: #0f172a; }
    .alt { font-size: 11px; fill: #b45309; font-weight: 600; }
  </style>

  <text x="380" y="30" text-anchor="middle" class="head">Hybrid Multimodal RAG — Course Material Assistant</text>
  <text x="380" y="50" text-anchor="middle" class="sub">MBAX 6418 · Assignment 2 · no credentials shown</text>

  <!-- Upload -->
  <rect x="240" y="70" width="280" height="52" class="box"/>
  <text x="380" y="89" text-anchor="middle" class="title">Upload course material</text>
  <text x="380" y="106" text-anchor="middle" class="sub">PDF (native) · PPTX → PDF via LibreOffice</text>
  <line x1="380" y1="122" x2="380" y2="150" class="arrow"/>

  <!-- Parse/OCR -->
  <rect x="200" y="150" width="360" height="56" class="box"/>
  <text x="380" y="170" text-anchor="middle" class="title">Parse / OCR / render pages</text>
  <text x="380" y="186" text-anchor="middle" class="sub">page text (chunks) + page images</text>
  <text x="380" y="200" text-anchor="middle" class="svc">document parser · port 9005</text>
  <line x1="380" y1="206" x2="380" y2="234" class="arrow"/>

  <!-- Split -->
  <g>
    <line x1="380" y1="234" x2="160" y2="270" class="arrow"/>
    <line x1="380" y1="234" x2="600" y2="270" class="arrow"/>
    <text x="160" y="262" text-anchor="middle" class="tag">text chunks</text>
    <text x="600" y="262" text-anchor="middle" class="tag">page images</text>
  </g>

  <!-- Text retriever -->
  <rect x="40" y="275" width="240" height="86" class="box"/>
  <text x="160" y="294" text-anchor="middle" class="title">BM25 · keyword retrieval</text>
  <text x="160" y="310" text-anchor="middle" class="title">+ dense text embeddings</text>
  <text x="160" y="326" text-anchor="middle" class="sub">source-preserving chunks</text>
  <text x="160" y="340" text-anchor="middle" class="svc">text embeddings · port 9002</text>

  <!-- Visual retriever -->
  <rect x="480" y="275" width="240" height="86" class="box"/>
  <text x="600" y="294" text-anchor="middle" class="title">Visual embeddings</text>
  <text x="600" y="310" text-anchor="middle" class="sub">text → image · (image → image)</text>
  <text x="600" y="326" text-anchor="middle" class="sub">diagrams · charts · memes</text>
  <text x="600" y="340" text-anchor="middle" class="svc">visual embeddings · port 9003</text>

  <line x1="160" y1="361" x2="280" y2="420" class="arrow"/>
  <line x1="600" y1="361" x2="480" y2="420" class="arrow"/>
  <text x="220" y="385" class="tag">top candidates</text>
  <text x="540" y="385" class="tag">top candidates</text>

  <!-- Fusion -->
  <rect x="230" y="420" width="300" height="52" class="box"/>
  <text x="380" y="440" text-anchor="middle" class="title">Candidate fusion</text>
  <text x="380" y="456" text-anchor="middle" class="sub">dedupe by (document, page) · merge text+image</text>
  <line x1="380" y1="472" x2="380" y2="498" class="arrow"/>

  <!-- Reranker -->
  <rect x="200" y="498" width="360" height="56" class="box"/>
  <text x="380" y="518" text-anchor="middle" class="title">Multimodal reranker</text>
  <text x="380" y="534" text-anchor="middle" class="svc">multimodal rerank · port 9004</text>
  <text x="380" y="548" text-anchor="middle" class="alt">RRF fallback if reranker unavailable</text>
  <line x1="380" y1="554" x2="380" y2="580" class="arrow"/>

  <!-- Grounded evidence -->
  <rect x="230" y="580" width="300" height="48" class="box"/>
  <text x="380" y="600" text-anchor="middle" class="title">Grounded evidence</text>
  <text x="380" y="616" text-anchor="middle" class="sub">top-5 text + slide images · full metadata</text>

  <!-- Branch -->
  <line x1="380" y1="628" x2="200" y2="668" class="arrow"/>
  <line x1="380" y1="628" x2="560" y2="668" class="arrow"/>

  <!-- QA -->
  <rect x="40" y="668" width="320" height="110" class="box"/>
  <text x="200" y="688" text-anchor="middle" class="title">Question answering · grounded response</text>
  <text x="200" y="706" text-anchor="middle" class="sub">strict JSON {answer, source_ids, insufficient}</text>
  <text x="200" y="722" text-anchor="middle" class="sub">Python validates ids → trusted Source list</text>
  <text x="200" y="738" text-anchor="middle" class="sub">insufficient → honest refusal, no fabrication</text>
  <text x="200" y="756" text-anchor="middle" class="svc">generation + vision · port 9001</text>

  <!-- Quiz/Flashcards -->
  <rect x="400" y="668" width="320" height="110" class="box"/>
  <text x="560" y="688" text-anchor="middle" class="title">Quiz / Flashcard generation</text>
  <text x="560" y="706" text-anchor="middle" class="sub">single call · strict validation (never repair)</text>
  <text x="560" y="722" text-anchor="middle" class="sub">answer key frozen at generation</text>
  <text x="560" y="738" text-anchor="middle" class="sub">grading = zero LLM calls</text>
  <text x="560" y="756" text-anchor="middle" class="svc">generation · port 9001</text>

  <!-- Outputs -->
  <rect x="40" y="806" width="320" height="56" class="box"/>
  <text x="200" y="826" text-anchor="middle" class="title">Answer + trusted sources</text>
  <text x="200" y="842" text-anchor="middle" class="sub">document · page · excerpt · slide image</text>
  <line x1="200" y1="778" x2="200" y2="806" class="arrow"/>

  <rect x="400" y="806" width="320" height="56" class="box"/>
  <text x="560" y="826" text-anchor="middle" class="title">Quiz / flashcards</text>
  <text x="560" y="842" text-anchor="middle" class="sub">server-side registry · reveal after submit</text>
  <line x1="560" y1="778" x2="560" y2="806" class="arrow"/>

  <text x="380" y="895" text-anchor="middle" class="tag">Services: ports 9001–9005 (class-provided) · API keys only in .env</text>
</svg>
